# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: mw.weblogic.console_deployed
version: "1"
name: WebLogic 管理控制台已部署
target: mw-weblogic
risk: medium
description: |
  app-deployment 中存在管理控制台应用（console）。
requires: [service_config]
remediation: |
  通过 console-enabled=false 关闭控制台，或限制访问并在基线登记。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.4 a) 入侵防范：遵循最小安装原则，仅安装需要的组件和应用程序"
  - "8.1.4.4 c) 入侵防范：限制管理终端的接入方式或网络地址范围"
