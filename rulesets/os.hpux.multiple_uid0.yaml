# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: os.hpux.multiple_uid0
version: "1"
name: 多个 UID 0 账号
target: os-hpux
risk: high
description: |
  除 root 外还有 UID=0 账号，等同多出一个无约束的超级用户，常见于后门或误配。
requires: [identity]
remediation: |
  删除或改 UID 并核实账号来源；确为厂商必需的记入基线。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.1 a) 身份鉴别：身份标识唯一，鉴别信息有复杂度要求并定期更换"
  - "8.1.4.2 c) 访问控制：及时删除或停用多余、过期账户，避免共享账户"
