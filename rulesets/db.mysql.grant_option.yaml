# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: db.mysql.grant_option
version: "1"
name: MySQL 全局权限带转授权
target: db-mysql
risk: medium
description: |
  全局权限附带 WITH GRANT OPTION，可扩散授权。
requires: [privilege]
remediation: |
  回收转授权或记入基线。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 d) 访问控制：授予管理用户所需的最小权限，实现权限分离"
  - "8.1.4.2 e) 访问控制：由授权主体配置访问控制策略"
