# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: db.mssql.clr_enabled
version: "1"
name: SQL Server CLR 集成已启用
target: db-sqlserver
risk: medium
description: |
  clr enabled 允许在数据库引擎内加载 .NET 程序集执行代码。
requires: [account_config]
remediation: |
  无业务依赖时关闭 CLR 集成。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.4 a) 入侵防范：遵循最小安装原则，仅安装需要的组件和应用程序"
