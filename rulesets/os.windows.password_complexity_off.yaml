# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: os.windows.password_complexity_off
version: "2"
name: Windows 未要求口令复杂度
target: os-windows
risk: medium
description: |
  secedit 导出的 PasswordComplexity=0 时，口令无复杂度要求。复杂度不能从 NetUserModalsGet 推断，本规则仅以 secedit 只读导出为准；导出渠道不可用时结论为 UNKNOWN，不解析本地化 net accounts 文案。secedit 与数值策略的适用范围一致（同一机器角色派生：未加入/工作组/域成员为本地 SAM，域控为域默认；FGPP 未覆盖）。
requires: [account_config]
remediation: |
  在安全策略中启用口令复杂度要求；确需关闭的记入基线。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.1 a) 身份鉴别：身份标识唯一，鉴别信息有复杂度要求并定期更换"
