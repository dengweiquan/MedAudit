# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: os.linux.high_capabilities
version: "2"
name: 非 root 进程持有高能力
target: os-linux
risk: high
description: |
  EUID 非 0 但有效能力集非空的进程；非 root 高能力不能简单判通过，需基线解释。
requires: [process]
remediation: |
  确认业务必需的能力并记入基线，或降权运行。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 d) 访问控制：授予管理用户所需的最小权限，实现权限分离"
