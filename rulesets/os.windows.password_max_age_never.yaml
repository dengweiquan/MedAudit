# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: os.windows.password_max_age_never
version: "3"
name: Windows 口令永不过期
target: os-windows
risk: medium
description: |
  MaximumPasswordAge 为 TIMEQ_FOREVER（永不过期）时，口令泄漏后长期有效。本规则只判永不过期，属于基础子集：有限但过长的周期尚未判定（实际值保留在事实 max_password_age_sec 中），阈值遵循组织基线，不随意补天数。覆盖范围见事实 scope 与 machine_role（未加入/工作组/域成员为本地 SAM，域控为域默认；FGPP 未覆盖）。
requires: [account_config]
remediation: |
  为口令设置有限的最长使用期；确需永不过期的服务账号记入基线。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.1 a) 身份鉴别：身份标识唯一，鉴别信息有复杂度要求并定期更换"
