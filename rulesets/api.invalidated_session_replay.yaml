# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: api.invalidated_session_replay
version: "2"
name: 凭据失效后重放
target: api
risk: high
description: |
  已失效会话（登出、过期、改密、吊销后捕获的凭证）重放仍被接受（重放探针 2xx）。通过要求每个负向通过探针（重放拒答）都有同端点差分正向对照（差分阶段该端点有 2xx，证明端点存在），否则拒答可能是端点不存在，不判通过；未运行的重放目标（非公开端点）是覆盖缺口，不判通过；公开端点重放跳过不算缺口。重放会话的有效性由操作员在配置中声明，本规则不验证该声明本身。
requires: [api_check]
remediation: |
  确保登出、过期、改密、吊销真实失效服务端会话（删会话、轮换密钥、缩短有效期），并复测重放。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.1 b) 身份鉴别：登录失败处理、限制非法登录次数、连接超时自动退出"
