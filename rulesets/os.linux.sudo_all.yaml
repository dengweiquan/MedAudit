# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: os.linux.sudo_all
version: "1"
name: sudo 全命令授权
target: os-linux
risk: medium
description: |
  非 root 主体可 sudo 执行任意命令（需口令）；成员范围应最小化并逐个核实。
requires: [account_config]
remediation: |
  收窄到具体命令或核实成员必需性；发行版默认管理组（如 %sudo）可记入基线。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 d) 访问控制：授予管理用户所需的最小权限，实现权限分离"
