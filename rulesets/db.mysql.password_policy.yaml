# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: db.mysql.password_policy
version: "2"
name: MySQL 口令策略弱
target: db-mysql
risk: medium
description: |
  validate_password 策略为 LOW 或长度要求低于 8 位时，弱口令可直接通过；未采集到该变量时结论为证据不足（UNKNOWN），不判通过。
requires: [account_config]
remediation: |
  安装并启用 validate_password 组件，策略设为 MEDIUM 及以上、长度至少 8 位。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.1 a) 身份鉴别：身份标识唯一，鉴别信息有复杂度要求并定期更换"
