# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: mw.iis.default_site
version: "1"
name: IIS 默认站点仍存在
target: mw-iis
risk: low
description: |
  Default Web Site 未删除（默认页与默认绑定扩大暴露面）。
requires: [service_config]
remediation: |
  删除或停用默认站点。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 b) 访问控制：重命名或删除默认账户，修改默认账户的默认口令"
  - "8.1.4.4 a) 入侵防范：遵循最小安装原则，仅安装需要的组件和应用程序"
