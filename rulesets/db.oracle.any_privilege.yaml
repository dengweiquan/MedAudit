# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: db.oracle.any_privilege
version: "2"
name: Oracle ANY 类系统权限
target: db-oracle
risk: medium
description: |
  如 SELECT ANY TABLE 等 ANY 类权限作用范围广。
requires: [privilege]
remediation: |
  按最小权限细化到对象级授权，或记入基线。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 d) 访问控制：授予管理用户所需的最小权限，实现权限分离"
