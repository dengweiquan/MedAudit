# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: db.mssql.password_policy
version: "1"
name: SQL Server 登录口令策略未启用
target: db-sqlserver
risk: medium
description: |
  SQL 登录的 CHECK_POLICY 或 CHECK_EXPIRATION 为 OFF 时，口令不受 Windows 口令策略约束或永不过期。
requires: [identity]
remediation: |
  对 SQL 登录启用 CHECK_POLICY 与 CHECK_EXPIRATION；服务账号确需豁免的记入基线。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.1 a) 身份鉴别：身份标识唯一，鉴别信息有复杂度要求并定期更换"
