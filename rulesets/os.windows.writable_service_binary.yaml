# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: os.windows.writable_service_binary
version: "1"
name: 服务二进制可被低权主体修改
target: os-windows
risk: high
description: |
  服务可执行文件的 DACL 存在授予 Everyone/Users/Authenticated Users 的显式写 ACE。
requires: [file_perm]
remediation: |
  收紧服务二进制的 DACL，移除低权主体的写权限。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 d) 访问控制：授予管理用户所需的最小权限，实现权限分离"
