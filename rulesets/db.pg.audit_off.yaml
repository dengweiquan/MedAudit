# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: db.pg.audit_off
version: "3"
name: PostgreSQL 未启用审计日志
target: db-postgres
risk: medium
description: |
  log_connections 与 log_statement 均未表明审计事件开启时，数据库无审计轨迹。注意：logging_collector=on 仅启用收集进程，不产生审计事件，不能单独作为审计已开启的证据；事件经 stderr/syslog 等其他输出路径时仍算审计，只评价实采的三个开关；pgaudit 等扩展审计不在本规则评价范围。
requires: [account_config]
remediation: |
  打开 log_connections（至少记录连接审计），或将 log_statement 设为 ddl 或 mod；logging_collector 仅决定日志收集方式，不产生审计事件。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.3 a) 安全审计：启用安全审计功能，覆盖每个用户，对重要用户行为和安全事件进行审计"
