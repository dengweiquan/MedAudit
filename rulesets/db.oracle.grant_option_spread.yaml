# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: db.oracle.grant_option_spread
version: "1"
name: Oracle 对象授权带 GRANT OPTION 可转授
target: db-oracle
risk: medium
description: |
  对象授权带 GRANT OPTION 时，被授者可把同一权限继续转授任意第三方，权限边界失控且回收时产生级联。厂商维护主体之间、厂商维护对象上的内部转授属产品机制，不判；只判业务侧的转授能力。
requires: [privilege]
remediation: |
  回收 GRANT OPTION 后以普通授权重新下发；确需分级下发的场景记入基线（privilege 以 :grant 后缀登记）。
