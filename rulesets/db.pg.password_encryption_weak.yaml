# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: db.pg.password_encryption_weak
version: "1"
name: PostgreSQL 口令加密为 md5
target: db-postgres
risk: medium
description: |
  password_encryption=md5 表示新设口令以 MD5 存储，弱于 scram-sha-256 且与 SCRAM 认证不兼容。
requires: [account_config]
remediation: |
  改为 scram-sha-256 并轮换各角色口令使存储升级。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.8 b) 数据保密性：采用密码技术保证重要数据在存储过程中的保密性"
