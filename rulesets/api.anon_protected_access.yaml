# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: api.anon_protected_access
version: "3"
name: 未认证访问受保护接口
target: api
risk: high
description: |
  匿名身份可达需认证或管理员端点（直接探针 2xx）。匿名证据只认报告中明确标记 anonymous=true 的探针：普通用户的拒答不得充当匿名探针，缺匿名探针或老报告缺身份标记时匿名从未被证实，不判通过；管理员端点的已认证身份 2xx 归垂直越权规则。覆盖按端点核对：每个适用端点须有匿名负向探针，仅有正向响应的端点是缺口。通过要求每个负向通过探针（匿名拒答）都有同端点正向对照（已认证或管理员 2xx），否则拒答可能是端点不存在，不判通过。
requires: [api_check]
remediation: |
  给受保护接口补鉴权：未携带有效会话一律拒绝，并复测匿名探针。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 a) 访问控制：对登录的用户分配账户和权限"
