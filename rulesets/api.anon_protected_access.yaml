# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: api.anon_protected_access
version: "1"
name: 未认证访问受保护接口
target: api
risk: high
description: |
  匿名身份可达需认证或管理员端点（直接探针 2xx）。需认证端点的匿名 2xx 本身即属匿名；管理员端点的匿名 2xx 按报告的匿名身份清单分流（清单缺失的老报告不认领，只归垂直越权规则）。通过要求每个通过探针都有同端点正向对照（已认证或管理员 2xx），否则拒答可能是端点不存在，不判通过。
requires: [api_check]
remediation: |
  给受保护接口补鉴权：未携带有效会话一律拒绝，并复测匿名探针。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 a) 访问控制：对登录的用户分配账户和权限"
