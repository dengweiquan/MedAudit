# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: os.hpux.weak_password_store
version: "1"
name: 口令哈希存放在世界可读的 passwd
target: os-hpux
risk: high
description: |
  未启用 Trusted Mode 且无 /etc/shadow（普通模式）：口令哈希留在 /etc/passwd，任何本地用户可读走离线破解。
requires: [account_config]
remediation: |
  启用 Shadow Password（或迁移至 Trusted Mode/目录服务），口令哈希移出 passwd；同时设置口令 aging 与最小长度策略。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.8 b) 数据保密性：采用密码技术保证重要数据在存储过程中的保密性"
