# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: os.linux.ssh_password_auth
version: "1"
name: sshd 允许口令鉴别
target: os-linux
risk: medium
description: |
  sshd 允许口令鉴别时，远程管理依赖口令（可爆破、可窃听重放），应改用密钥鉴别。
requires: [account_config]
remediation: |
  将 PasswordAuthentication 设为 no，仅允许密钥登录；确需口令通道的记入基线。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.4 c) 入侵防范：限制管理终端的接入方式或网络地址范围"
