# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: mw.tomcat.plain_listener
version: "1"
name: Tomcat 明文监听对外暴露
target: mw-tomcat
risk: medium
description: |
  Connector 未启用 TLS 且监听非回环地址（含默认全网卡）。
requires: [service_config]
remediation: |
  明文 Connector 仅绑回环（address=127.0.0.1）或下线，对外走 TLS/反代。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.8 a) 数据保密性：采用密码技术保证重要数据在传输过程中的保密性"
