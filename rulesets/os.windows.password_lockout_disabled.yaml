# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: os.windows.password_lockout_disabled
version: "1"
name: Windows 未启用登录失败锁定
target: os-windows
risk: medium
description: |
  LockoutThreshold=0（锁定阈值关闭）时，口令可被无限次尝试爆破。
requires: [account_config]
remediation: |
  设置登录失败锁定阈值（如 5 次）及锁定时长；确需关闭的记入基线。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.1 b) 身份鉴别：登录失败处理、限制非法登录次数、连接超时自动退出"
