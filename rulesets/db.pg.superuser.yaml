# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: db.pg.superuser
version: "1"
name: PostgreSQL 角色拥有 SUPERUSER
target: db-postgres
risk: high
description: |
  SUPERUSER 角色可绕过全部权限检查并执行任意系统操作。非内置初始化角色原则上不应持有。
requires: [identity]
remediation: |
  回收 SUPERUSER，改为按需授予细粒度权限；确属业务必需的记入基线。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 d) 访问控制：授予管理用户所需的最小权限，实现权限分离"
