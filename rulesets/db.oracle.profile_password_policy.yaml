# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: db.oracle.profile_password_policy
version: "1"
name: Oracle 概要文件口令策略无限制
target: db-oracle
risk: medium
description: |
  概要文件的口令寿命/失败锁定/复用限制为 UNLIMITED 时，口令永不过期且无锁定保护。
requires: [account_config]
remediation: |
  为各概要文件设置 PASSWORD_LIFE_TIME 与 FAILED_LOGIN_ATTEMPTS 等有限值，或记入基线。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.1 a) 身份鉴别：身份标识唯一，鉴别信息有复杂度要求并定期更换"
  - "8.1.4.1 b) 身份鉴别：登录失败处理、限制非法登录次数、连接超时自动退出"
