# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: os.hpux.setuid_unexpected
version: "1"
name: 基线外 setuid-root 二进制
target: os-hpux
risk: high
description: |
  setuid-root 二进制是经典提权面；系统自带集合之外的 setuid-root 文件应逐个核实（应用自研程序尤甚）。
requires: [file_perm]
remediation: |
  核实业务必需性，非必需的去掉 setuid 位（chmod u-s）；厂商必需的记入基线。
