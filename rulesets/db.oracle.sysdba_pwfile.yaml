# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: db.oracle.sysdba_pwfile
version: "1"
name: Oracle 密码文件 SYSDBA 授权
target: db-oracle
risk: high
description: |
  V$PWFILE_USERS 中的 SYSDBA/SYSOPER 授权；DBA 角色不等于 SYSDBA，单独建模。
requires: [privilege]
remediation: |
  确认管理授权必要性，OSDBA 等 OS 认证来源另行核查。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 d) 访问控制：授予管理用户所需的最小权限，实现权限分离"
