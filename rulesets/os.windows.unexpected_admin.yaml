# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: os.windows.unexpected_admin
version: "1"
name: Administrators 组成员异常
target: os-windows
risk: high
description: |
  本地 Administrators 组成员不在基线允许清单中。
requires: [role_edge]
remediation: |
  核查新增管理员身份的合法性，或将其纳入基线。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 c) 访问控制：及时删除或停用多余、过期账户，避免共享账户"
  - "8.1.4.2 d) 访问控制：授予管理用户所需的最小权限，实现权限分离"
