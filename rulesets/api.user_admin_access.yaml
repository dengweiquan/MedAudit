# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: api.user_admin_access
version: "3"
name: 普通身份访问管理员接口
target: api
risk: high
description: |
  非管理员身份（含匿名，老报告无法区分时亦归此）可达管理员端点（直接探针 2xx，垂直越权）。通过要求每个负向通过探针（非管理员拒答）都有同端点管理员正向对照（管理员 2xx），否则拒答可能是端点不存在，不判通过；只配置管理员身份而无非管理员探针时，非管理员从未被测，不判通过。
requires: [api_check]
remediation: |
  给管理员端点补角色校验：非管理员一律拒绝，并复测普通身份与匿名探针。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 d) 访问控制：授予管理用户所需的最小权限，实现权限分离"
