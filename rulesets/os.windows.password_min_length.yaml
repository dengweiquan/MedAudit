# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: os.windows.password_min_length
version: "3"
name: Windows 口令最小长度不足
target: os-windows
risk: medium
description: |
  本地 SAM 或域默认策略的口令最小长度低于项目基线 8 位时，短口令易被爆破。阈值 8 位为项目基线选择（与 MySQL 口令长度口径一致），非未核实标准的规定值；覆盖范围见事实 scope 与 machine_role：未加入、工作组与域成员为本地 SAM 策略（域成员本机查询不等于域账号默认策略），域控为域默认策略；细粒度用户策略（FGPP/PSO）未覆盖。
requires: [account_config]
remediation: |
  将口令最小长度提高到至少 8 位（组策略或本地安全策略）；确需短口令的记入基线并注明覆盖范围。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.1 a) 身份鉴别：身份标识唯一，鉴别信息有复杂度要求并定期更换"
