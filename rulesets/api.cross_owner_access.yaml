# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: api.cross_owner_access
version: "1"
name: 跨所有者访问
target: api
risk: high
description: |
  非管理员身份跨主体读到他人的私有数据（跨主体探针 2xx 且命中属主 canary，水平越权）。2xx 但未命中 canary 仍为证据不足（可能是脱敏或共享数据），不判 FAIL 也不判 PASS。通过要求每个通过探针都有同端点属主自访问正向对照（属主 2xx），否则拒答可能是端点不存在。
requires: [api_check]
remediation: |
  给资源端点补属主校验：只能读自有资源，管理员除外；并复测跨主体探针。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 d) 访问控制：授予管理用户所需的最小权限，实现权限分离"
