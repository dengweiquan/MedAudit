# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: mw.tomcat.config_writable
version: "1"
name: Tomcat 配置可被非属主修改
target: mw-tomcat
risk: high
description: |
  conf 目录/关键配置/webapps 对 group 或 other 可写，低权主体可篡改高权服务加载内容。
requires: [file_perm]
remediation: |
  收紧 conf 与 webapps 权限（属主 root/服务账号，组与他人只读或无权）。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 d) 访问控制：授予管理用户所需的最小权限，实现权限分离"
