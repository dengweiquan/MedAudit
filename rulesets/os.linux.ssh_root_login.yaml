# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: os.linux.ssh_root_login
version: "2"
name: sshd 允许 root 口令登录
target: os-linux
risk: high
description: |
  PermitRootLogin=yes 时 root 可直接口令登录，远程爆破一旦成功即获最高权限。
requires: [account_config]
remediation: |
  将 PermitRootLogin 设为 no 或 prohibit-password，root 仅经普通账号 sudo 提权。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.4 c) 入侵防范：限制管理终端的接入方式或网络地址范围"
