# MedAudit 内置规则元数据（由 internal/rules 生成，请勿手改）
id: db.mssql.control_server
version: "2"
name: SQL Server 显式 CONTROL SERVER 授权
target: db-sqlserver
risk: high
description: |
  显式 GRANT CONTROL SERVER（非固定角色路径）；含经服务器角色传递闭包间接持有（M8-2）。
requires: [privilege]
remediation: |
  回收显式高权或记入基线。
compliance: # 等保 2.0（GB/T 22239-2019）第三级 · 安全计算环境
  - "8.1.4.2 d) 访问控制：授予管理用户所需的最小权限，实现权限分离"
